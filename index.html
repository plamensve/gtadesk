<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="GTA Desk — работна среда за прототипи и нови функционалности.">
  <title>GTA Desk | Prototype Lab</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:#0b1220;color:#f1f5f9;display:grid;place-items:center;padding:24px}
    main{width:min(100%,680px);padding:clamp(30px,6vw,64px);border:1px solid #26354c;border-radius:24px;background:linear-gradient(150deg,#142135,#0f192a);box-shadow:0 20px 80px #0003}
    .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.05em;font-size:15px}
    .mark{display:grid;place-items:center;width:39px;height:39px;border-radius:11px;background:#2dd4bf;color:#09201f;font-weight:900}
    .eyebrow{margin-top:48px;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;color:#5eead4}
    h1{font-size:clamp(35px,6vw,58px);line-height:1.1;letter-spacing:-.05em;margin:14px 0}
    p{font-size:17px;line-height:1.65;color:#a9b9cc;max-width:480px}
    footer{margin-top:42px;padding-top:22px;border-top:1px solid #26354c;color:#8297ad;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">G</span> GTA DESK</div>
    <div class="eyebrow">Prototype lab</div>
    <h1>Една платформа.<br>Нови възможности.</h1>
    <p>GTA Desk е работна среда за разработване и тестване на нови функционалности. Скоро тук ще се появят първите прототипи.</p>
    <footer>GTA Desk · gtadesk.com</footer>
  </main>
</body>
</html>
